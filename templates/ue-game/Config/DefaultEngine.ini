[/Script/EngineSettings.GameMapsSettings]
GameInstanceClass=/Script/__PROJECT__.__PROJECT__GameInstance
; GameDefaultMap / EditorStartupMap: set once the first map exists (e.g. /Game/Maps/L_MainMenu.L_MainMenu)

[/Script/Engine.InputSettings]

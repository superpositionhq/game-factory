[/Script/EngineSettings.GameMapsSettings]
GameInstanceClass=/Script/__PROJECT__.__PROJECT__GameInstance
; GameDefaultMap / EditorStartupMap: set once the first map exists (e.g. /Game/Maps/L_MainMenu.L_MainMenu)

[/Script/Engine.InputSettings]
DefaultPlayerInputClass=/Script/EnhancedInput.EnhancedPlayerInput
DefaultInputComponentClass=/Script/EnhancedInput.EnhancedInputComponent

[/Script/Engine.UserInterfaceSettings]
; Shipping recording builds (the gameplay video is recorded from a Windows build of the game running the mobile
; renderer): without it a UE game is DPI-unaware and Windows scales the window on high-DPI displays.
bAllowHighDPIInGameMode=True

[/Script/AndroidRuntimeSettings.AndroidRuntimeSettings]
; An Android phone game (Platform.json). Keep these as they are: the validators hold the project, the APK and the
; dataset to them. Orientation is the game's own, set when the project was created, never Sensor or FullSensor.
PackageName=com.__ANDROID_NAME__.game
StoreVersion=1
VersionDisplayName=1.0
MinSDKVersion=26
TargetSDKVersion=34
Orientation=__ANDROID_ORIENTATION__
bBuildForArm64=True
bBuildForX8664=False
bSupportsVulkan=True
bBuildForES31=True
; the game's data inside the APK: one file to install, nothing beside it
bPackageDataInsideApk=True
bFullScreen=True

[/Script/LinuxTargetPlatform.LinuxTargetSettings]
; The game's tasks are graded on Linux with the mobile renderer (Vulkan, feature level ES3_1): a Linux package of the
; game needs that shader format beside the desktop one.
+TargetedRHIs=SF_VULKAN_ES31
